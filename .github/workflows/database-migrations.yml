name: Database Migration Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-clean-database:
    name: Apply migrations to disposable Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Apply every migration to a clean local database
        run: supabase db reset --local

      - name: Exercise lead activity triggers and privacy boundaries
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/migration_smoke.sql

      - name: Lint the migrated schema
        run: supabase db lint --local --fail-on error

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
