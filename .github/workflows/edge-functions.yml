name: Edge Functions

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: edge-functions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: deno check supabase/functions/whatsapp-webhook/index.ts supabase/functions/whatsapp-webhook-worker/index.ts
